<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MentorCon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="container-fluid">
        <header class="row">
            <nav class="navbar navbar-expand-lg bg-success-subtle p-4">
                <div class="container-fluid">
                    <span class="navbar-brand fw-bold">MENTORCON</span>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbar-nav">
                        <ul class="navbar-nav ms-auto fw-semibold">
                            <li class="nav-item">
                                <a href="#" class="nav-link active">Central</a>
                            </li>
                            <li class="nav-item">
                                <a href="" class="nav-link">Meu Perfil</a>
                            </li>
                            <li class="nav-item">
                                <a href="" class="nav-link">Monitorias</a>
                            </li>
                            <li class="nav-item">
                                <a href="" class="nav-link">Sair</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>
        <main class="row justify-content-center my-4">
            <div class="col-11">
                <h3 class="mb-3">Disciplinas cursando:</h3>
                <input type="text" placeholder="Digite uma disciplina" class="caixaTexto" style="padding: 1rem;">
                <hr class="divisor">
                <h3 class="mb-3">Solicitações:</h3>
                <textarea name="solicitacao" id="solicitacao" placeholder="Descreva sua solicitação aqui..." class="caixaTexto" style="padding: 0.5rem 0 0 1rem; height: 6rem;"></textarea>
                <input class="btn btn-primary mt-2" type="submit" value="Enviar">
                <hr class="divisor">
                <h3 class="mb-3">Solicitações Abertas:</h3>
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Disciplina: X</h5>
                        <p class="card-text">Horário: Seg, 14:00 - 16:00</p>
                        <a href="" class="btn btn-primary">Atender</a>
                        <a href="" class="btn btn-secondary">Ver mais</a>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
