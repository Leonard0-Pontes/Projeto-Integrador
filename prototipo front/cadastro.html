<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - Gerenciador de Monitoria</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">
    <main>
        <h1 class="text-center">Crie sua conta</h1>
        <form action="login.html" method="GET">
            <div>
                <label for="cad_nome">&#128100; Nome:</label>
                <input type="text" id="cad_nome" name="nome" required>
            </div>
            <br>
            <div>
                <label for="cad_email">&#9993; Email:</label>
                <input type="email" id="cad_email" name="email" required>
            </div>
            <br>
            <div>
                <label for="cad_senha">&#128274; Senha:</label>
                <input type="password" id="cad_senha" name="senha" required>
            </div>
            <br>
            <div class="text-center">
                <button type="submit" class="primario w-100">CADASTRAR</button>
            </div>
            <p class="text-center mt-1">
                Já tem uma conta? <a href="login.html">Faça login</a>
            </p>
        </form>
    </main>
</body>

</html>
