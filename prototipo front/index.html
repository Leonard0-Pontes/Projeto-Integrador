<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu do Usuário - Gerenciador de Monitoria</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="topbar">
        <div>
            <button>&#9776; Menu</button>
            <strong class="nav-brand">Nome da Empresa</strong>
        </div>
        <nav>
            <a href="perfil.html" class="nav-link">Meu Perfil</a>
            <a href="monitorias.html" class="nav-link">Monitorias</a>
            <a href="login.html" class="nav-link">Sair</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Disciplinas cursando</h2>
            <div class="search-group">
                <input type="text" placeholder="Digite ou selecione a disciplina">
                <button class="secundario">Ver Todas</button>
            </div>
        </section>

        <hr>

        <section>
            <h2>Solicitações</h2>
            <div>
                <textarea placeholder="Descreva sua solicitação..." rows="3"></textarea>
                <button class="primario mt-1">Solicitar</button>
            </div>
        </section>

        <hr>

        <section>
            <h2>Solicitações Abertas</h2>
            <article>
                <p>Disciplina: Matemática Discreta</p>
                <p class="info-desc">Horário: Seg, 14:00 - 16:00</p>
                <div class="action-buttons">
                    <button class="primario">Atender</button>
                    <button class="secundario">Ver mais</button>
                </div>
            </article>
            <article>
                <p>Disciplina: Programação Web</p>
                <p class="info-desc">Horário: Ter, 10:00 - 12:00</p>
                <div class="action-buttons">
                    <button class="primario">Atender</button>
                    <button class="secundario">Ver mais</button>
                </div>
            </article>
        </section>
    </main>
</body>

</html>
