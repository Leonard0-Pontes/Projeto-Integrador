<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gerenciador de Monitoria</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">
    <main>
        <header class="header-login">
            <h1 class="titulo-login">Nome EMP</h1>
            <div>
                <p>[Logo]</p>
            </div>
        </header>

        <form action="dashboard.html" method="GET">
            <div>
                <label for="email_login">E-mail:</label>
                <input type="email" id="email_login" name="email" placeholder="Ex: usuario@email.com" required>
            </div>
            <br>
            <div>
                <label for="senha_login">Senha:</label>
                <input type="password" id="senha_login" name="senha" placeholder="******" required>
            </div>
            <br>
            <div class="form-actions">
                <button type="submit" class="primario">Logar</button>
                <a href="cadastro.html" class="btn-link secundario">Cadastro</a>
            </div>
        </form>

        <footer class="login-footer">
            <p>Nome da Empresa</p>
        </footer>
    </main>
</body>

</html>
