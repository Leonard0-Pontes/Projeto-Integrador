<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MentorCon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="style.css" rel="stylesheet">
</head>

<body class="intro">
    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-6">
                <header class="card border-0">
                    <div class="card-body" style="margin-top: 2rem;">
                        <h1 class="card-title">MENTORCON</h1>
                        <p class="card-text subtitulo">Software desenvolvido para auxiliar na monitoria escolar.</p>
                    </div>
                </header>
            </div>
            <div class="col-6">
                <div class="card" style="width: 30rem;">
                    <div class="card-body" style="padding: 2.5rem;">
                        <h2 class="card-title card-space">Login</h2>
                        <form>
                            <div>
                                <label for="email" class="form-label">E-mail:</label>
                                <input type="text" class="form-control inputCard" placeholder="fulano@email.com"><br>
                            </div>
                            <div>
                                <label for="senha" class="form-label">Senha:</label>
                                <input type="password" class="form-control inputCard"><br>
                            </div>
                            <div>
                                <input type="submit" class="btn btn-success" value="Entrar">
                                <input type="button" class="btn btn-secondary" value="Cadastrar-se"
                                    onclick="window.location.href='./cadastro.html'">
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
