<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitações - SOMA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="container-fluid">
        <header class="row">
            <nav class="navbar navbar-expand-lg bg-success-subtle p-4">
                <div class="container-fluid">
                    <span class="navbar-brand fw-bold">SOMA</span>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbar-nav">
                        <ul class="navbar-nav ms-auto fw-semibold">
                            <li class="nav-item">
                                <a href="./index.html" class="nav-link" id="btn-home">Central</a>
                            </li>
                            <li class="nav-item">
                                <a href="./perfil.html" class="nav-link" id="btn-perfil">Meu Perfil</a>
                            </li>
                            <li class="nav-item">
                                <a href="#" class="nav-link active" id="btn-mon">Solicitações</a>
                            </li>
                            <li class="nav-item">
                                <a href="./login.html" class="nav-link logout" id="btn-sair">Sair</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>
        <main class="row justify-content-center my-4">
            <div class="col-10">
                <h3 class="mb-3">Solicitações:</h3>
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Criar Solicitação:</h5>
                        <form id="criarSolicita">
                            <div class="row card-space">
                                <div class="col">
                                    <label for="assunto" class="form-label">Assunto:</label>
                                    <input type="text" id="assunto" name="assunto" class="form-control" required
                                        maxlength="100">
                                </div>
                                <div class="col">
                                    <label for="data" class="form-label">Data:</label>
                                    <input type="date" id="data" name="data" class="form-control" required>
                                </div>
                                <div class="col">
                                    <label for="disciplinaId" class="form-label">Disciplina:</label>
                                    <select id="disciplinaId" class="form-select" required>
                                        <option value="" disabled selected>Escolha uma disciplina</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row card-space">
                                <div class="col">
                                    <label for="horario" class="form-label">Horário:</label>
                                    <input type="time" id="horario" name="horario" class="form-control" required>
                                </div>
                                <div class="col">
                                    <label for="modalidade" class="form-label">Modalidade:</label>
                                    <select id="modalidade" class="form-select" required>
                                        <option value="" disabled selected>Escolha uma modalidade</option>
                                        <option value="Presencial">Presencial</option>
                                        <option value="Online">Online</option>
                                        <option value="Nenhuma">Sem preferência</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row card-space">
                                <div class="col">
                                    <label for="descricao" class="form-label">Descrição:</label>
                                    <div class="position-relative">
                                        <textarea id="descricao" name="descricao" class="form-control pb-4" rows="4" maxlength="500" aria-describedby="contadorDescricao" placeholder="Descreva brevemente o assunto da monitoria."></textarea>
                                        <small id="contadorDescricao" class="position-absolute bottom-0 end-0 px-2 pb-2 text-body-secondary pe-none">500 caracteres restantes</small>
                                    </div>
                                </div>
                            </div>
                            <div class="row justify-content-center">
                                <div class="d-flex flex-wrap justify-content-center gap-2">
                                    <button class="btn btn-primary" type="submit">Enviar</button>
                                    <button class="btn btn-outline-secondary" type="reset">Limpar campos</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
                <hr class="divisor">
                <div id="listaSolicita"></div>
            </div>
        </main>
    </div>
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="auth.js"></script>
    <script src="solicitacao.js"></script>
</body>

</html>
