<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - SOMA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body class="intro">
    <div class="container mt-4">
        <div class="row">
            <header class="col-6">
                <div class="card border-0">
                    <div class="card-body" style="margin-top: 2rem;">
                        <h1 class="card-title card-title-intro">SOMA</h1>
                        <p class="card-text subtitulo">Sistema de Organização de Monitorias Acadêmicas</p>
                    </div>
                </div>
            </header>
            <div class="col-6">
                <div class="card" style="width: 30rem;">
                    <div class="card-body" style="padding: 2.5rem;">
                        <h2 class="card-title card-title-intro card-space">Cadastro</h2>
                        <form id="cadastroForm">
                            <div>
                                <label for="nomeFull" class="form-label">Nome Completo:</label>
                                <input type="text" id="nomeFull" name="nomeFull" class="form-control inputCard"
                                    placeholder="Fulano Sicrano de Beltrano" required><br>
                            </div>
                            <div>
                                <label for="email" class="form-label">E-mail:</label>
                                <input type="email" id="email" name="email" class="form-control inputCard"
                                    placeholder="fulano@email.com" required><br>
                            </div>
                            <div>
                                <label for="senha" class="form-label">Senha:</label>
                                <input type="password" id="senha" name="senha" class="form-control inputCard"
                                    required><br>
                            </div>
                            <div>
                                <label for="confSenha" class="form-label">Confirmar Senha:</label>
                                <input type="password" id="confSenha" name="confSenha" class="form-control inputCard"
                                    required><br>
                            </div>
                            <div>
                                <label for="funcao" class="form-label">Função:</label>
                                <select id="funcao" name="funcao" class="form-select" required>
                                    <option value="" disabled selected>Selecione sua função</option>
                                    <option value="Aluno">Aluno</option>
                                    <option value="Monitor">Monitor</option>
                                </select><br>
                            </div>
                            <div>
                                <label for="curso" class="form-label">Curso:</label>
                                <input type="text" id="curso" name="curso" class="form-control inputCard" required><br>
                            </div>
                            <div>
                                <label for="periodo" class="form-label">Periodo:</label>
                                <select id="periodo" name="periodo" class="form-select" required>
                                    <option value="" disabled selected>Selecione seu período</option>
                                    <option value="Primeiro">1º período</option>
                                    <option value="Segundo">2º período</option>
                                    <option value="Terceiro">3º período</option>
                                    <option value="Quarto">4º período</option>
                                    <option value="Quinto">5º período</option>
                                    <option value="Sexto">6º período</option>
                                </select><br>
                            </div>
                            <div>
                                <input type="submit" class="btn btn-success" value="Cadastrar">
                                <input type="button" class="btn btn-danger" value="Cancelar"
                                    onclick="window.location.href='./login.html'">
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="config.js"></script>
    <script src="login.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="./cadastro.js"></script>
</body>

</html>
