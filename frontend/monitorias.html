<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitorias - MentorCon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="container-fluid">
        <header class="row">
            <nav class="navbar navbar-expand-lg bg-success-subtle p-4">
                <div class="container-fluid">
                    <span class="navbar-brand fw-bold">MENTORCON</span>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbar-nav">
                        <ul class="navbar-nav ms-auto fw-semibold">
                            <li class="nav-item">
                                <a href="./index.html" class="nav-link" id="btn-home">Central</a>
                            </li>
                            <li class="nav-item">
                                <a href="./perfil.html" class="nav-link" id="btn-perfil">Meu Perfil</a>
                            </li>
                            <li class="nav-item">
                                <a href="#" class="nav-link active" id="btn-mon">Monitorias</a>
                            </li>
                            <li class="nav-item">
                                <a href="./login.html" class="nav-link logout" id="btn-sair">Sair</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>
        <main class="row justify-content-center my-4">
            <div class="col-11">
                <h3 class="mb-3">Solicitações:</h3>
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Criar Solicitação:</h5>
                        <form id="criarSolicita">
                            <div class="row card-space">
                                <div class="col">
                                    <label for="disciplina" class="form-label">Disciplina:</label><br>
                                    <select class="form-select" name="disciplina" id="disciplina">
                                        <option selected>Escolha uma disciplina</option>
                                        <option value="math">Matemática</option>
                                        <option value="ingles">Inglês</option>
                                        <option value="redes">Redes</option>
                                    </select>
                                </div>
                                <div class="col">
                                    <label for="monitor" class="form-label">Monitor:</label><br>
                                    <input type="text" id="monitor" name="monitor" class="form-control">
                                </div>
                                <div class="col">
                                    <label for="data" class="form-label">Data:</label><br>
                                    <input type="text" id="data" name="data" class="form-control">
                                </div>
                            </div>
                            <div class="row card-space">
                                <div class="col">
                                    <label for="horario" class="form-label">Horário:</label>
                                    <input type="text" id="horario" name="horario" class="form-control">
                                </div>
                                <div class="col">
                                    <label for="local" class="form-label">Local:</label>
                                    <input type="text" id="local" name="local" class="form-control">
                                </div>
                                <div class="col">
                                    <label for="assunto" class="form-label">Assunto:</label>
                                    <input type="text" id="assunto" name="assunto" class="form-control">
                                </div>
                            </div>
                            <div class="row justify-content-center">
                                <div class="col-6">
                                    <input class="btn btn-primary overflowFull" type="submit" value="Enviar">
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
                <hr class="divisor">
                <h3 class="mb-3">Solicitações Pendentes:</h3>
                <div class="card">
                    <div class="card-body">
                        <form>
                            <div class="card-header text-center" style="margin-bottom: 1rem;">Filtros</div>
                            <div class="row card-space">
                                <div class="col">
                                    <label for="disciplinaFilter" class="form-label">Disciplina:</label><br>
                                    <select class="form-select" name="disciplinaFilter" id="disciplinaFilter">
                                        <option selected>Escolha uma disciplina</option>
                                        <option value="math">Matemática</option>
                                        <option value="ingles">Inglês</option>
                                        <option value="redes">Redes</option>
                                    </select>
                                </div>
                                <div class="col">
                                    <label for="monitorFilter" class="form-label">Monitor:</label><br>
                                    <input type="text" id="monitorFilter" name="monitorFilter" class="form-control">
                                </div>
                                <div class="col">
                                    <label for="dataFilter" class="form-label">Data:</label><br>
                                    <input type="text" id="dataFilter" name="dataFilter" class="form-control">
                                </div>
                            </div>
                            <div class="row card-space">
                                <div class="col">
                                    <label for="horarioFilter" class="form-label">Horário:</label>
                                    <input type="text" id="horarioFilter" name="horarioFilter" class="form-control">
                                </div>
                                <div class="col">
                                    <label for="localFilter" class="form-label">Local:</label>
                                    <input type="text" id="localFilter" name="localFilter" class="form-control">
                                </div>
                                <div class="col">
                                    <label for="assuntoFilter" class="form-label">Assunto:</label>
                                    <input type="text" id="assuntoFilter" name="assuntoFilter" class="form-control">
                                </div>
                            </div>
                            <div class="row">
                                <div class="col">
                                    <input type="submit" class="btn btn-success overflowFull" value="Confirmar">
                                </div>
                                <div class="col">
                                    <input type="reset" class="btn btn-danger overflowFull" value="Limpar">
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
                <div id="listaSolicita"></div>
                <div class="card mt-4">
                    <div class="card-body">
                        <h5 class="card-title">Teste</h5>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
