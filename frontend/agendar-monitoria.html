<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar monitoria - SOMA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
        <section class="card w-100" style="max-width: 760px;">
            <div class="card-body p-4 p-md-5">
                <h1 class="h2 card-space">Agendar monitoria</h1>

                <div id="mensagemAgendamento" class="alert d-none" role="status" aria-live="polite"></div>

                <form id="formAgendar" novalidate>
                    <div class="mb-3">
                        <label for="solicitacaoId" class="form-label">
                            Solicitação de origem:
                        </label>
                        <select id="solicitacaoId" class="form-select" required>
                            <option value="">Carregando solicitações...</option>
                        </select>
                    </div>

                    <div id="detalhesSolicitacao" class="alert alert-secondary d-none" aria-live="polite"></div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="data" class="form-label">Data:</label>
                            <input type="date" id="data" class="form-control" required>
                        </div>

                        <div class="col-md-4 mb-3">
                            <label for="horarioInicio" class="form-label">
                                Horário de início:
                            </label>
                            <input type="time" id="horarioInicio" class="form-control" required>
                        </div>

                        <div class="col-md-4 mb-3">
                            <label for="horarioFim" class="form-label">
                                Horário de término:
                            </label>
                            <input type="time" id="horarioFim" class="form-control" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="modalidade" class="form-label">Modalidade:</label>
                        <select id="modalidade" class="form-select" required>
                            <option value="">Escolha uma modalidade</option>
                            <option value="Presencial">Presencial</option>
                            <option value="Online">Online</option>
                        </select>
                    </div>

                    <div id="campoLocal" class="mb-3 d-none">
                        <label for="local" class="form-label">Local:</label>
                        <input type="text" id="local" class="form-control" maxlength="250">
                    </div>

                    <div id="campoLink" class="mb-3 d-none">
                        <label for="link" class="form-label">Link da reunião:</label>
                        <input type="url" id="link" class="form-control" placeholder="https://...">
                    </div>

                    <div class="d-flex flex-wrap gap-2 mt-4">
                        <button type="submit" class="btn btn-success" id="btnAgendar" disabled>
                            Agendar monitoria
                        </button>
                        <a href="./index.html" class="btn btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="auth.js"></script>
    <script src="agendar.js"></script>
</body>

</html>
