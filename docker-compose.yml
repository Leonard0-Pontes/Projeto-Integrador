services:
  backend:
    build:
      context: ./back-end
      dockerfile: Dockerfile
      args:
        DATABASE_URL_UNPOOLED: ${DATABASE_URL_UNPOOLED}
        DATABASE_URL: ${DATABASE_URL}
    container_name: pi_backend
    ports:
      - "3000:3000"
    volumes:
      - ./back-end:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CORS_ORIGIN=http://localhost:5173
    env_file:
      - ./back-end/.env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pi_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
